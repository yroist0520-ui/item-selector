<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loading...</title>
  <script>
    // GitHub Pages SPA fallback: redirect 404 routes back to index.html
    // The app's Router basename handles the actual path matching
    sessionStorage.setItem('spa-redirect', location.pathname + location.search);
    location.replace('/item-selector/' + location.search);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
